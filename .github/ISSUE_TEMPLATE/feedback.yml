name: Feedback / feature request
description: An idea, an improvement, or anything that felt rough
labels: [enhancement]
body:
  - type: input
    id: version
    attributes:
      label: SpinZero version
      description: Shown in Help ▸ About SpinZero (prefilled if you came from the app).
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: The use case or pain point — or just tell us what you think of the app.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution / additional context
      description: Alternatives you've considered, mockups, references to other tools — anything that helps.
