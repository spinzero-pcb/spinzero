name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: SpinZero version
      description: Shown in Help ▸ About SpinZero (prefilled if you came from the app).
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead. Screenshots help a lot.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: design-context
    attributes:
      label: Design / file context
      description: KiCad or Altium? Roughly how big (sheets, components, layers)? Anything unusual about the design?
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: If the app showed an error, attach `spinzero.log` from your app log folder if you can.
